<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .title { font-size: 16px; font-weight: 700; fill: #24292f; }
      .subtitle { font-size: 12px; fill: #57606a; }
      .label { font-size: 12px; font-weight: 600; fill: #24292f; }
      .formula { font-size: 13px; fill: #24292f; }
      .value { font-size: 14px; font-weight: 700; }
      .desc { font-size: 11px; fill: #57606a; }
      .axis-label { font-size: 10px; fill: #57606a; }
    </style>
  </defs>

  <!-- ===== LEFT: Leverage ===== -->
  <text x="170" y="25" text-anchor="middle" class="title">Leverage</text>
  <text x="170" y="42" text-anchor="middle" class="subtitle">P(X ∧ Y) − P(X) · P(Y)</text>

  <!-- Observed bar -->
  <text x="20" y="80" class="label">Observed</text>
  <text x="20" y="95" class="desc">P(X ∧ Y)</text>
  <rect x="110" y="68" width="150" height="30" rx="4" fill="#0969da" fill-opacity="0.3" stroke="#0969da" stroke-width="1.5"/>
  <text x="270" y="88" class="value" fill="#0969da">0.30</text>

  <!-- Expected bar -->
  <text x="20" y="130" class="label">Expected</text>
  <text x="20" y="145" class="desc">P(X) · P(Y)</text>
  <rect x="110" y="118" width="100" height="30" rx="4" fill="#6e7781" fill-opacity="0.25" stroke="#6e7781" stroke-width="1.5"/>
  <text x="220" y="138" class="value" fill="#6e7781">0.20</text>

  <!-- Difference highlight -->
  <rect x="210" y="68" width="50" height="30" rx="0" fill="#2da44e" fill-opacity="0.3" stroke="#2da44e" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="210" y1="100" x2="210" y2="155" stroke="#2da44e" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="235" y="115" text-anchor="middle" class="value" fill="#2da44e">+0.10</text>
  <text x="235" y="170" text-anchor="middle" class="desc">leverage</text>

  <!-- Scale -->
  <line x1="30" y1="200" x2="310" y2="200" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="30" y="218" text-anchor="middle" class="axis-label">−0.25</text>
  <text x="170" y="218" text-anchor="middle" class="axis-label">0</text>
  <text x="310" y="218" text-anchor="middle" class="axis-label">+0.25</text>
  <circle cx="30" cy="200" r="3" fill="#cf222e"/>
  <circle cx="170" cy="200" r="3" fill="#6e7781"/>
  <circle cx="230" cy="200" r="5" fill="#2da44e"/>
  <text x="30" y="235" text-anchor="middle" class="desc" fill="#cf222e">repulsion</text>
  <text x="170" y="235" text-anchor="middle" class="desc">independent</text>
  <text x="310" y="235" text-anchor="middle" class="desc" fill="#2da44e">attraction</text>

  <text x="170" y="265" text-anchor="middle" class="formula">= 0.30 − (0.50 × 0.40) = +0.10</text>

  <!-- ===== RIGHT: Conviction ===== -->
  <text x="540" y="25" text-anchor="middle" class="title">Conviction</text>
  <text x="540" y="42" text-anchor="middle" class="subtitle">(1 − P(Y)) / (1 − Confidence)</text>

  <!-- Visual: ratio bars -->
  <text x="390" y="80" class="label">1 − P(Y)</text>
  <text x="390" y="95" class="desc">¬Y baseline</text>
  <rect x="490" y="68" width="150" height="30" rx="4" fill="#8250df" fill-opacity="0.25" stroke="#8250df" stroke-width="1.5"/>
  <text x="650" y="88" class="value" fill="#8250df">0.60</text>

  <text x="390" y="130" class="label">1 − conf</text>
  <text x="390" y="145" class="desc">error rate</text>
  <rect x="490" y="118" width="100" height="30" rx="4" fill="#cf222e" fill-opacity="0.25" stroke="#cf222e" stroke-width="1.5"/>
  <text x="600" y="138" class="value" fill="#cf222e">0.40</text>

  <!-- Ratio arrow -->
  <text x="680" y="100" text-anchor="middle" class="value" fill="#24292f">÷</text>

  <!-- Scale -->
  <rect x="410" y="185" width="260" height="45" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <line x1="430" y1="210" x2="650" y2="210" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="430" cy="210" r="3" fill="#cf222e"/>
  <text x="430" y="228" text-anchor="middle" class="axis-label">0</text>
  <circle cx="540" cy="210" r="3" fill="#6e7781"/>
  <text x="540" y="228" text-anchor="middle" class="axis-label">1</text>
  <circle cx="580" cy="210" r="5" fill="#2da44e"/>
  <text x="580" y="198" text-anchor="middle" class="value" fill="#2da44e">1.5</text>
  <text x="650" y="228" text-anchor="middle" class="axis-label">∞</text>

  <text x="480" y="250" text-anchor="middle" class="desc" fill="#cf222e">&lt; 1 negative</text>
  <text x="540" y="250" text-anchor="middle" class="desc">= 1 indep.</text>
  <text x="620" y="250" text-anchor="middle" class="desc" fill="#2da44e">&gt; 1 positive</text>

  <text x="540" y="285" text-anchor="middle" class="formula">= (1 − 0.40) / (1 − 0.60) = 0.60 / 0.40 = 1.50</text>
</svg>
