<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="720" height="320" rx="16" fill="#fafbfc" stroke="#e1e4e8" stroke-width="1.5"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#24292e">Interestingness &amp; Rule Quality Metrics</text>

  <!-- Added Value / Certainty Factor -->
  <rect x="30" y="55" width="210" height="245" rx="12" fill="#fff" stroke="#d1d5da" stroke-width="1"/>
  <text x="135" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">Added Value</text>

  <!-- Bar comparison -->
  <text x="55" y="105" font-size="10" fill="#586069">P(Y)</text>
  <rect x="95" y="92" width="100" height="18" rx="4" fill="#90caf9"/>
  <text x="200" y="105" font-size="10" fill="#586069">0.40</text>

  <text x="55" y="135" font-size="10" fill="#586069">P(Y|X)</text>
  <rect x="95" y="122" width="150" height="18" rx="4" fill="#1565c0"/>
  <text x="250" y="135" font-size="10" fill="#586069">0.60</text>

  <!-- Bracket showing difference -->
  <line x1="195" y1="148" x2="195" y2="162" stroke="#e53935" stroke-width="1.5"/>
  <line x1="195" y1="155" x2="245" y2="155" stroke="#e53935" stroke-width="1.5" stroke-dasharray="3"/>
  <text x="205" y="175" font-size="11" font-weight="bold" fill="#e53935">+0.20</text>

  <text x="135" y="200" text-anchor="middle" font-size="10" fill="#586069">AV = confidence − prevalence</text>
  <text x="135" y="218" text-anchor="middle" font-size="10" fill="#586069">How much X boosts P(Y)</text>

  <text x="135" y="245" text-anchor="middle" font-size="11" font-weight="600" fill="#6f42c1">Certainty Factor</text>
  <text x="135" y="262" text-anchor="middle" font-size="10" fill="#586069">CF = AV / (1 − prevalence)</text>
  <text x="135" y="278" text-anchor="middle" font-size="10" fill="#586069">Normalized: −1 to +1</text>

  <!-- Zhang's Metric -->
  <rect x="260" y="55" width="200" height="245" rx="12" fill="#fff" stroke="#d1d5da" stroke-width="1"/>
  <text x="360" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#00695c">Zhang's Metric</text>

  <text x="360" y="108" text-anchor="middle" font-size="10" fill="#586069">Direction-aware, robust</text>

  <!-- Scale -->
  <rect x="285" y="120" width="150" height="16" rx="4" fill="url(#zhangGrad)"/>
  <defs>
    <linearGradient id="zhangGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="50%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <text x="285" y="152" text-anchor="middle" font-size="9" fill="#e53935">−1</text>
  <text x="360" y="152" text-anchor="middle" font-size="9" fill="#757575">0</text>
  <text x="435" y="152" text-anchor="middle" font-size="9" fill="#2e7d32">+1</text>

  <!-- Arrow -->
  <line x1="395" y1="120" x2="395" y2="112" stroke="#00695c" stroke-width="2"/>
  <polygon points="392,112 398,112 395,106" fill="#00695c"/>
  <text x="395" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#00695c">0.50</text>

  <text x="360" y="175" text-anchor="middle" font-size="10" fill="#586069">conf(X→Y) − conf(¬X→Y)</text>
  <text x="360" y="190" text-anchor="middle" font-size="10" fill="#586069">―――――――――――――</text>
  <text x="360" y="205" text-anchor="middle" font-size="10" fill="#586069">max(conf, P(Y|¬X))</text>

  <text x="360" y="232" text-anchor="middle" font-size="10" fill="#586069">+1 → perfect positive</text>
  <text x="360" y="249" text-anchor="middle" font-size="10" fill="#586069">0 → no association</text>
  <text x="360" y="266" text-anchor="middle" font-size="10" fill="#586069">−1 → perfect negative</text>
  <text x="360" y="288" text-anchor="middle" font-size="10" font-weight="bold" fill="#00695c">Robust to marginals</text>

  <!-- Klosgen / Rule Power -->
  <rect x="480" y="55" width="210" height="245" rx="12" fill="#fff" stroke="#d1d5da" stroke-width="1"/>
  <text x="585" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">Composite Metrics</text>

  <text x="585" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#e65100">Klösgen</text>
  <text x="585" y="130" text-anchor="middle" font-size="10" fill="#586069">√support × added_value</text>
  <text x="585" y="148" text-anchor="middle" font-size="10" fill="#586069">Balances frequency + strength</text>

  <line x1="500" y1="162" x2="670" y2="162" stroke="#e1e4e8" stroke-width="1"/>

  <text x="585" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#e65100">Rule Power Factor</text>
  <text x="585" y="202" text-anchor="middle" font-size="10" fill="#586069">support × confidence</text>
  <text x="585" y="220" text-anchor="middle" font-size="10" fill="#586069">Frequency × reliability</text>

  <line x1="500" y1="234" x2="670" y2="234" stroke="#e1e4e8" stroke-width="1"/>

  <text x="585" y="254" text-anchor="middle" font-size="11" font-weight="600" fill="#e65100">Sebag-Schoenauer</text>
  <text x="585" y="274" text-anchor="middle" font-size="10" fill="#586069">conf / (1 − conf)</text>
  <text x="585" y="292" text-anchor="middle" font-size="10" fill="#586069">Positive / negative ratio</text>
</svg>
