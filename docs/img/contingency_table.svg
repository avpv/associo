<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .title { font-size: 16px; font-weight: 700; fill: #24292f; }
      .header { font-size: 13px; font-weight: 600; fill: #ffffff; }
      .cell-text { font-size: 13px; fill: #24292f; }
      .cell-formula { font-size: 11px; fill: #57606a; }
      .label { font-size: 12px; font-weight: 600; fill: #24292f; }
      .sublabel { font-size: 11px; fill: #57606a; }
      .total-text { font-size: 13px; font-weight: 600; fill: #24292f; }
      .example { font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" class="title">2 × 2 Contingency Table</text>

  <!-- Column headers -->
  <rect x="190" y="60" width="126" height="32" rx="6" ry="6" fill="#2da44e"/>
  <text x="253" y="81" text-anchor="middle" class="header">Y = 1 (RHS)</text>
  <rect x="322" y="60" width="126" height="32" rx="6" ry="6" fill="#cf222e"/>
  <text x="385" y="81" text-anchor="middle" class="header">Y = 0 (¬RHS)</text>
  <rect x="454" y="60" width="58" height="32" rx="6" ry="6" fill="#6e7781"/>
  <text x="483" y="81" text-anchor="middle" class="header">Total</text>

  <!-- Row headers -->
  <rect x="10" y="100" width="90" height="32" rx="6" ry="6" fill="#0969da"/>
  <text x="55" y="121" text-anchor="middle" class="header">X = 1</text>
  <rect x="10" y="191" width="90" height="32" rx="6" ry="6" fill="#8250df"/>
  <text x="55" y="212" text-anchor="middle" class="header">X = 0</text>
  <rect x="10" y="282" width="90" height="32" rx="6" ry="6" fill="#6e7781"/>
  <text x="55" y="303" text-anchor="middle" class="header">Total</text>

  <!-- Row label text -->
  <text x="55" y="145" text-anchor="middle" class="sublabel">(LHS)</text>
  <text x="55" y="236" text-anchor="middle" class="sublabel">(¬LHS)</text>

  <!-- Cell: X=1, Y=1 (XY) -->
  <rect x="190" y="100" width="126" height="75" rx="4" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
  <text x="253" y="130" text-anchor="middle" class="cell-text">XY</text>
  <text x="253" y="148" text-anchor="middle" class="cell-formula">count(X ∧ Y)</text>
  <text x="253" y="166" text-anchor="middle" class="example" fill="#2da44e">30</text>

  <!-- Cell: X=1, Y=0 (X¬Y) -->
  <rect x="322" y="100" width="126" height="75" rx="4" fill="#fff1e5" stroke="#bf8700" stroke-width="1.5"/>
  <text x="385" y="130" text-anchor="middle" class="cell-text">X¬Y</text>
  <text x="385" y="148" text-anchor="middle" class="cell-formula">count(X ∧ ¬Y)</text>
  <text x="385" y="166" text-anchor="middle" class="example" fill="#bf8700">20</text>

  <!-- Row total: X -->
  <rect x="454" y="100" width="58" height="75" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="483" y="130" text-anchor="middle" class="total-text">X</text>
  <text x="483" y="148" text-anchor="middle" class="cell-formula">count(X)</text>
  <text x="483" y="166" text-anchor="middle" class="example" fill="#24292f">50</text>

  <!-- Cell: X=0, Y=1 (¬XY) -->
  <rect x="190" y="191" width="126" height="75" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="253" y="221" text-anchor="middle" class="cell-text">¬XY</text>
  <text x="253" y="239" text-anchor="middle" class="cell-formula">count(¬X ∧ Y)</text>
  <text x="253" y="257" text-anchor="middle" class="example" fill="#0969da">10</text>

  <!-- Cell: X=0, Y=0 (¬X¬Y) -->
  <rect x="322" y="191" width="126" height="75" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="385" y="221" text-anchor="middle" class="cell-text">¬X¬Y</text>
  <text x="385" y="239" text-anchor="middle" class="cell-formula">count(¬X ∧ ¬Y)</text>
  <text x="385" y="257" text-anchor="middle" class="example" fill="#6e7781">40</text>

  <!-- Row total: ¬X -->
  <rect x="454" y="191" width="58" height="75" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="483" y="221" text-anchor="middle" class="total-text">¬X</text>
  <text x="483" y="239" text-anchor="middle" class="cell-formula">count(¬X)</text>
  <text x="483" y="257" text-anchor="middle" class="example" fill="#24292f">50</text>

  <!-- Column total: Y -->
  <rect x="190" y="282" width="126" height="50" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="253" y="304" text-anchor="middle" class="total-text">Y</text>
  <text x="253" y="322" text-anchor="middle" class="cell-formula">count(Y) = 40</text>

  <!-- Column total: ¬Y -->
  <rect x="322" y="282" width="126" height="50" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="385" y="304" text-anchor="middle" class="total-text">¬Y</text>
  <text x="385" y="322" text-anchor="middle" class="cell-formula">count(¬Y) = 60</text>

  <!-- Grand total -->
  <rect x="454" y="282" width="58" height="50" rx="4" fill="#e8e8e8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="483" y="304" text-anchor="middle" class="total-text">n</text>
  <text x="483" y="322" text-anchor="middle" class="cell-formula">100</text>
</svg>
