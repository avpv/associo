<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .title { font-size: 16px; font-weight: 700; fill: #24292f; }
      .set-label { font-size: 14px; font-weight: 600; }
      .formula { font-size: 13px; fill: #24292f; }
      .desc { font-size: 11px; fill: #57606a; }
      .value { font-size: 18px; font-weight: 700; }
      .subtitle { font-size: 12px; fill: #57606a; }
    </style>
  </defs>

  <!-- Title -->
  <text x="220" y="25" text-anchor="middle" class="title">Jaccard Similarity</text>
  <text x="220" y="42" text-anchor="middle" class="subtitle">Intersection over Union — ignores ¬X ∧ ¬Y</text>

  <!-- Universe rectangle -->
  <rect x="20" y="52" width="400" height="185" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>

  <!-- Union highlight (both circles combined) -->
  <circle cx="170" cy="150" r="85" fill="#8250df" fill-opacity="0.12" stroke="#8250df" stroke-width="2"/>
  <circle cx="270" cy="150" r="85" fill="#8250df" fill-opacity="0.12" stroke="#8250df" stroke-width="2"/>

  <!-- Intersection highlight -->
  <clipPath id="clip-x-jacc">
    <circle cx="170" cy="150" r="85"/>
  </clipPath>
  <circle cx="270" cy="150" r="85" clip-path="url(#clip-x-jacc)" fill="#cf222e" fill-opacity="0.35"/>

  <!-- Labels -->
  <text x="120" y="145" text-anchor="middle" class="value" fill="#8250df">20</text>
  <text x="120" y="162" text-anchor="middle" class="desc">X only</text>

  <text x="220" y="145" text-anchor="middle" class="value" fill="#cf222e">30</text>
  <text x="220" y="162" text-anchor="middle" class="desc">X ∧ Y</text>

  <text x="320" y="145" text-anchor="middle" class="value" fill="#8250df">10</text>
  <text x="320" y="162" text-anchor="middle" class="desc">Y only</text>

  <!-- Set labels -->
  <text x="100" y="90" class="set-label" fill="#0969da">X</text>
  <text x="330" y="90" class="set-label" fill="#2da44e">Y</text>

  <!-- Formula -->
  <text x="220" y="258" text-anchor="middle" class="formula">Jaccard = |X ∩ Y| / |X ∪ Y| = 30 / (20 + 30 + 10) = 0.50</text>
  <text x="220" y="276" text-anchor="middle" class="desc">Ranges from 0 (no overlap) to 1 (identical sets)</text>
</svg>
