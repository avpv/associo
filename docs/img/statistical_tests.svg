<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="720" height="320" rx="16" fill="#fafbfc" stroke="#e1e4e8" stroke-width="1.5"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#24292e">Statistical Tests — Measuring Association Strength</text>

  <!-- Chi-squared section -->
  <rect x="30" y="55" width="200" height="240" rx="12" fill="#fff" stroke="#d1d5da" stroke-width="1"/>
  <text x="130" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#0366d6">χ² (Chi-Squared)</text>

  <!-- Observed vs Expected grid -->
  <rect x="55" y="95" width="65" height="35" fill="#dcedc8" stroke="#7cb342" stroke-width="1" rx="4"/>
  <text x="87" y="117" text-anchor="middle" font-size="11" fill="#33691e">30</text>
  <rect x="125" y="95" width="65" height="35" fill="#fff9c4" stroke="#fdd835" stroke-width="1" rx="4"/>
  <text x="157" y="117" text-anchor="middle" font-size="11" fill="#f57f17">20</text>

  <text x="130" y="150" text-anchor="middle" font-size="10" fill="#586069">vs expected</text>

  <rect x="55" y="160" width="65" height="35" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1" rx="4"/>
  <text x="87" y="182" text-anchor="middle" font-size="11" fill="#1a237e">20</text>
  <rect x="125" y="160" width="65" height="35" fill="#fce4ec" stroke="#e91e63" stroke-width="1" rx="4"/>
  <text x="157" y="182" text-anchor="middle" font-size="11" fill="#880e4f">8</text>

  <text x="130" y="215" text-anchor="middle" font-size="10" fill="#586069">Σ (O−E)² / E</text>
  <text x="130" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#0366d6">χ² = 16.07</text>
  <text x="130" y="255" text-anchor="middle" font-size="10" fill="#586069">Higher = stronger</text>
  <text x="130" y="272" text-anchor="middle" font-size="10" fill="#586069">association</text>

  <!-- Phi coefficient section -->
  <rect x="260" y="55" width="200" height="240" rx="12" fill="#fff" stroke="#d1d5da" stroke-width="1"/>
  <text x="360" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#6f42c1">φ (Phi Coefficient)</text>

  <!-- Scale bar -->
  <text x="360" y="105" text-anchor="middle" font-size="10" fill="#586069">Normalized χ² → correlation-like</text>
  <rect x="290" y="115" width="140" height="20" rx="4" fill="url(#phiGrad)"/>
  <defs>
    <linearGradient id="phiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="50%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#1e88e5"/>
    </linearGradient>
  </defs>
  <text x="290" y="152" text-anchor="middle" font-size="10" fill="#e53935">−1</text>
  <text x="360" y="152" text-anchor="middle" font-size="10" fill="#757575">0</text>
  <text x="430" y="152" text-anchor="middle" font-size="10" fill="#1e88e5">+1</text>

  <!-- Arrow pointing to value -->
  <line x1="387" y1="115" x2="387" y2="108" stroke="#6f42c1" stroke-width="2"/>
  <polygon points="384,108 390,108 387,102" fill="#6f42c1"/>
  <text x="387" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#6f42c1">0.40</text>

  <text x="360" y="178" text-anchor="middle" font-size="10" fill="#586069">Range: −1 to +1</text>
  <text x="360" y="198" text-anchor="middle" font-size="10" fill="#586069">= 0 → independent</text>
  <text x="360" y="218" text-anchor="middle" font-size="10" fill="#586069">+1 → perfect positive</text>
  <text x="360" y="238" text-anchor="middle" font-size="10" fill="#586069">−1 → perfect negative</text>
  <text x="360" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#6f42c1">Like Pearson r for</text>
  <text x="360" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#6f42c1">binary variables</text>

  <!-- Odds Ratio section -->
  <rect x="490" y="55" width="200" height="240" rx="12" fill="#fff" stroke="#d1d5da" stroke-width="1"/>
  <text x="590" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#e36209">Odds Ratio (OR)</text>

  <!-- Two fraction bars -->
  <text x="590" y="110" text-anchor="middle" font-size="10" fill="#586069">Odds of Y with X</text>
  <rect x="530" y="118" width="120" height="28" rx="6" fill="#fff3e0" stroke="#fb8c00" stroke-width="1"/>
  <text x="590" y="137" text-anchor="middle" font-size="12" fill="#e65100">30 / 20 = 1.5</text>

  <text x="590" y="165" text-anchor="middle" font-size="14" fill="#586069">÷</text>

  <text x="590" y="182" text-anchor="middle" font-size="10" fill="#586069">Odds of Y without X</text>
  <rect x="530" y="190" width="120" height="28" rx="6" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1"/>
  <text x="590" y="209" text-anchor="middle" font-size="12" fill="#0d47a1">10 / 40 = 0.25</text>

  <line x1="530" y1="230" x2="650" y2="230" stroke="#d1d5da" stroke-width="1"/>
  <text x="590" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#e36209">OR = 6.0</text>
  <text x="590" y="272" text-anchor="middle" font-size="10" fill="#586069">&gt;1 positive, &lt;1 negative</text>
  <text x="590" y="288" text-anchor="middle" font-size="10" fill="#586069">=1 independent</text>
</svg>
