<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340">
  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="780" height="340" rx="16" fill="#fafbfc" stroke="#e1e4e8" stroke-width="1.5"/>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#24292e">Graph Algorithms — Finding Structure in Associations</text>

  <!-- 1. Affinity Propagation -->
  <rect x="20" y="50" width="175" height="270" rx="12" fill="#fff" stroke="#d1d5da" stroke-width="1"/>
  <text x="107" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">Affinity Propagation</text>

  <!-- Cluster 1 -->
  <circle cx="70" cy="120" r="8" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <circle cx="95" cy="108" r="8" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <circle cx="85" cy="135" r="8" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <circle cx="95" cy="108" r="3" fill="#1565c0"/>
  <line x1="70" y1="120" x2="95" y2="108" stroke="#90caf9" stroke-width="1"/>
  <line x1="70" y1="120" x2="85" y2="135" stroke="#90caf9" stroke-width="1"/>
  <line x1="95" y1="108" x2="85" y2="135" stroke="#90caf9" stroke-width="1"/>

  <!-- Cluster 2 -->
  <circle cx="130" cy="150" r="8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <circle cx="150" cy="135" r="8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <circle cx="155" cy="160" r="8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <circle cx="150" cy="135" r="3" fill="#2e7d32"/>
  <line x1="130" y1="150" x2="150" y2="135" stroke="#a5d6a7" stroke-width="1"/>
  <line x1="130" y1="150" x2="155" y2="160" stroke="#a5d6a7" stroke-width="1"/>
  <line x1="150" y1="135" x2="155" y2="160" stroke="#a5d6a7" stroke-width="1"/>

  <text x="107" y="195" text-anchor="middle" font-size="9" fill="#586069">Auto-detects number</text>
  <text x="107" y="207" text-anchor="middle" font-size="9" fill="#586069">of clusters</text>
  <text x="107" y="227" text-anchor="middle" font-size="9" fill="#586069">Each cluster has an</text>
  <text x="107" y="239" text-anchor="middle" font-size="9" fill="#586069">exemplar (●) center</text>
  <text x="107" y="262" text-anchor="middle" font-size="9" font-weight="bold" fill="#1565c0">Non-overlapping</text>
  <text x="107" y="278" text-anchor="middle" font-size="9" fill="#586069">preference_factor:</text>
  <text x="107" y="290" text-anchor="middle" font-size="9" fill="#586069">0=few → 100=many</text>

  <!-- 2. Louvain Communities -->
  <rect x="205" y="50" width="175" height="270" rx="12" fill="#fff" stroke="#d1d5da" stroke-width="1"/>
  <text x="292" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#6f42c1">Louvain Communities</text>

  <!-- Community 1 -->
  <ellipse cx="260" cy="125" rx="35" ry="25" fill="#e1bee7" fill-opacity="0.3" stroke="#6f42c1" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="245" cy="118" r="6" fill="#ce93d8"/>
  <circle cx="260" cy="130" r="6" fill="#ce93d8"/>
  <circle cx="275" cy="120" r="6" fill="#ce93d8"/>
  <line x1="245" y1="118" x2="260" y2="130" stroke="#ba68c8" stroke-width="1"/>
  <line x1="260" y1="130" x2="275" y2="120" stroke="#ba68c8" stroke-width="1"/>
  <line x1="245" y1="118" x2="275" y2="120" stroke="#ba68c8" stroke-width="1"/>

  <!-- Community 2 -->
  <ellipse cx="320" cy="140" rx="30" ry="22" fill="#fff9c4" fill-opacity="0.3" stroke="#f9a825" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="308" cy="135" r="6" fill="#ffd54f"/>
  <circle cx="330" cy="130" r="6" fill="#ffd54f"/>
  <circle cx="320" cy="150" r="6" fill="#ffd54f"/>
  <line x1="308" y1="135" x2="330" y2="130" stroke="#ffca28" stroke-width="1"/>
  <line x1="308" y1="135" x2="320" y2="150" stroke="#ffca28" stroke-width="1"/>

  <!-- Inter-community edge -->
  <line x1="275" y1="120" x2="308" y2="135" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="2"/>

  <text x="292" y="195" text-anchor="middle" font-size="9" fill="#586069">Maximizes modularity</text>
  <text x="292" y="207" text-anchor="middle" font-size="9" fill="#586069">(dense internal edges)</text>
  <text x="292" y="227" text-anchor="middle" font-size="9" fill="#586069">Hierarchical — finds</text>
  <text x="292" y="239" text-anchor="middle" font-size="9" fill="#586069">natural group structure</text>
  <text x="292" y="262" text-anchor="middle" font-size="9" font-weight="bold" fill="#6f42c1">Non-overlapping</text>
  <text x="292" y="278" text-anchor="middle" font-size="9" fill="#586069">resolution: 0.5=few</text>
  <text x="292" y="290" text-anchor="middle" font-size="9" fill="#586069">→ 2.0=many groups</text>

  <!-- 3. Cliques -->
  <rect x="390" y="50" width="175" height="270" rx="12" fill="#fff" stroke="#d1d5da" stroke-width="1"/>
  <text x="477" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">Maximal Cliques</text>

  <!-- Full clique of 4 -->
  <circle cx="455" cy="110" r="7" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <circle cx="500" cy="110" r="7" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <circle cx="455" cy="150" r="7" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <circle cx="500" cy="150" r="7" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <!-- All 6 edges = complete graph -->
  <line x1="455" y1="110" x2="500" y2="110" stroke="#e65100" stroke-width="1.5"/>
  <line x1="455" y1="110" x2="455" y2="150" stroke="#e65100" stroke-width="1.5"/>
  <line x1="455" y1="110" x2="500" y2="150" stroke="#e65100" stroke-width="1.5"/>
  <line x1="500" y1="110" x2="455" y2="150" stroke="#e65100" stroke-width="1.5"/>
  <line x1="500" y1="110" x2="500" y2="150" stroke="#e65100" stroke-width="1.5"/>
  <line x1="455" y1="150" x2="500" y2="150" stroke="#e65100" stroke-width="1.5"/>

  <text x="477" y="180" text-anchor="middle" font-size="9" fill="#586069">Every node connected</text>
  <text x="477" y="192" text-anchor="middle" font-size="9" fill="#586069">to every other node</text>
  <text x="477" y="212" text-anchor="middle" font-size="9" fill="#586069">Finds tightly-knit</text>
  <text x="477" y="224" text-anchor="middle" font-size="9" fill="#586069">groups (full subgraphs)</text>
  <text x="477" y="247" text-anchor="middle" font-size="9" font-weight="bold" fill="#e65100">Overlapping</text>
  <text x="477" y="262" text-anchor="middle" font-size="9" fill="#586069">Items can belong to</text>
  <text x="477" y="274" text-anchor="middle" font-size="9" fill="#586069">multiple cliques</text>

  <!-- 4. Connected Components -->
  <rect x="575" y="50" width="185" height="270" rx="12" fill="#fff" stroke="#d1d5da" stroke-width="1"/>
  <text x="667" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#00695c">Connected Components</text>

  <!-- Component 1 -->
  <circle cx="625" cy="110" r="6" fill="#80cbc4" stroke="#00695c" stroke-width="1.5"/>
  <circle cx="650" cy="100" r="6" fill="#80cbc4" stroke="#00695c" stroke-width="1.5"/>
  <circle cx="640" cy="125" r="6" fill="#80cbc4" stroke="#00695c" stroke-width="1.5"/>
  <line x1="625" y1="110" x2="650" y2="100" stroke="#4db6ac" stroke-width="1"/>
  <line x1="625" y1="110" x2="640" y2="125" stroke="#4db6ac" stroke-width="1"/>

  <!-- Component 2 (isolated) -->
  <circle cx="700" cy="115" r="6" fill="#ffab91" stroke="#bf360c" stroke-width="1.5"/>
  <circle cx="720" cy="130" r="6" fill="#ffab91" stroke="#bf360c" stroke-width="1.5"/>
  <line x1="700" y1="115" x2="720" y2="130" stroke="#ff8a65" stroke-width="1"/>

  <!-- Component 3 (single) -->
  <circle cx="690" cy="155" r="6" fill="#b0bec5" stroke="#546e7a" stroke-width="1.5"/>

  <text x="667" y="185" text-anchor="middle" font-size="9" fill="#586069">Find isolated groups</text>
  <text x="667" y="197" text-anchor="middle" font-size="9" fill="#586069">(reachable via any path)</text>
  <text x="667" y="217" text-anchor="middle" font-size="9" fill="#586069">Simplest structure —</text>
  <text x="667" y="229" text-anchor="middle" font-size="9" fill="#586069">which items are linked?</text>
  <text x="667" y="252" text-anchor="middle" font-size="9" font-weight="bold" fill="#00695c">Non-overlapping</text>
  <text x="667" y="267" text-anchor="middle" font-size="9" fill="#586069">min_edge_weight filters</text>
  <text x="667" y="279" text-anchor="middle" font-size="9" fill="#586069">weak connections</text>
</svg>
