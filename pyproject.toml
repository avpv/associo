[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "associo"
version = "0.1.0"
description = "High-performance association analysis library built on Polars"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "polars>=0.20.0",
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/associo"]
